name: security

# Runs the same checks as `make security` (scripts/security.py). Scanner tools are container images
# pinned by digest inside that script; the three actions below are pinned to commit SHAs.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: new CVEs appear without any code change

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies-and-secrets:
    name: lockfiles, osv, pip-audit, npm audit, trivy fs, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # full history for the secret scan
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.11.21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      - name: Install frontend dependencies from the lockfile (npm ci, no install scripts)
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Run checks
        run: python scripts/security.py locks osv pip-audit npm-audit trivy-fs secrets

  images:
    name: trivy image (backend + Piston)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Scan images
        run: python scripts/security.py trivy-image
